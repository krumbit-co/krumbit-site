apiVersion: apps/v1
kind: Deployment
metadata:
  name: krumbit-app
  namespace: easynet
  labels:
    app: krumbit-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: krumbit-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: krumbit-app
        easynet.world/descheduler-safe: "true"
    spec:
      containers:
        - name: web
          image: node:22-alpine
          command:
            - /bin/sh
            - -ec
            - |
              apk add --no-cache git
              git clone --depth 1 --branch master https://github.com/krumbit-co/krumbit-site.git /app
              cd /app
              npm ci --include=dev
              npm run export
              npm start
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: krumbit-app
      terminationGracePeriodSeconds: 30
