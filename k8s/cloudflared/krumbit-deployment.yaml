apiVersion: apps/v1
kind: Deployment
metadata:
  name: krumbit-app
  namespace: easynet
  labels:
    app: krumbit-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: krumbit-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: krumbit-app
        easynet.world/descheduler-safe: "true"
    spec:
      initContainers:
        - name: build-site
          image: node:22-alpine
          command:
            - /bin/sh
            - -ec
            - |
              apk add --no-cache git
              git clone --depth 1 --branch master https://github.com/krumbit-co/krumbit-site.git /work/src
              cd /work/src
              npm ci
              npm run export
              cp -R dist/static/. /site/
          volumeMounts:
            - name: work
              mountPath: /work
            - name: site
              mountPath: /site
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      containers:
        - name: web
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: work
          emptyDir: {}
        - name: site
          emptyDir: {}
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: krumbit-app
      terminationGracePeriodSeconds: 30
